<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Payment QR not set up yet">
  <!-- Fallback shown when no payment QR is set in admin (Bun Theory settings → Payment QR). Deliberately not a scannable code. -->
  <rect width="320" height="320" rx="20" fill="#fafaf9"/>
  <rect x="24" y="24" width="272" height="272" rx="14" fill="none" stroke="#d6d3d1" stroke-width="2" stroke-dasharray="10 8"/>
  <g fill="#a8a29e">
    <rect x="56" y="56" width="56" height="56" rx="8"/><rect x="208" y="56" width="56" height="56" rx="8"/><rect x="56" y="208" width="56" height="56" rx="8"/>
  </g>
  <g fill="#fafaf9"><rect x="68" y="68" width="32" height="32" rx="4"/><rect x="220" y="68" width="32" height="32" rx="4"/><rect x="68" y="220" width="32" height="32" rx="4"/></g>
  <g fill="#a8a29e"><rect x="78" y="78" width="12" height="12" rx="2"/><rect x="230" y="78" width="12" height="12" rx="2"/><rect x="78" y="230" width="12" height="12" rx="2"/></g>
  <text x="160" y="152" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#44403c">Payment QR</text>
  <text x="160" y="176" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#78716c">not set up yet</text>
  <text x="160" y="232" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#a8a29e">Please pay by cash, or</text>
  <text x="160" y="248" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#a8a29e">ask staff for details</text>
</svg>
