<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..800&display=swap"></head>
<body class="br-pad">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start">
  <div class="br-field"><label for="f1">Your name</label><input id="f1" class="br-input" placeholder="Full name"><p class="br-help">Empty</p></div>
  <div class="br-field"><label for="f2">Serving time</label><input id="f2" class="br-input is-focus" value="7:00 pm"><p class="br-help">Focus</p></div>
  <div class="br-field"><label for="f3">Event address</label><input id="f3" class="br-input" value="12 Jalan SS 2/24, Petaling Jaya"><p class="br-help">Filled</p></div>
  <div class="br-field"><label for="f4">Phone</label><input id="f4" class="br-input" value="012 345" aria-invalid="true" aria-describedby="e4"><p class="br-error" id="e4">Enter a full phone number so we can call you.</p></div>
  <div class="br-field"><label for="f5">Email</label><input id="f5" class="br-input" value="sending@example.com" disabled><p class="br-help">Locked while submitting</p></div>
  <div class="br-field"><label for="f6">Dietary notes <span class="br-faint" style="font-weight:400">(optional)</span></label><textarea id="f6" class="br-input" placeholder="Allergies, no beef, vegetarian guests"></textarea></div>
</div>
</body></html>
